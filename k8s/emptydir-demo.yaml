apiVersion: v1
kind: Pod
metadata:
  name: emptydir-demo
  labels:
    app: emptydir-demo
spec:
  containers:
    - name: log-producer
      image: busybox:1.36
      command:
        - /bin/sh
        - -c
        - |
          while true; do
            echo "$(date) Movie Watchlist log entry" >> /shared/app.log
            sleep 5
          done
      volumeMounts:
        - name: shared-logs
          mountPath: /shared

    - name: log-consumer
      image: busybox:1.36
      command:
        - /bin/sh
        - -c
        - |
          while true; do
            if [ -f /shared/app.log ]; then
              echo "Reading shared logs:"
              tail -n 3 /shared/app.log
            else
              echo "Waiting for logs..."
            fi
            sleep 8
          done
      volumeMounts:
        - name: shared-logs
          mountPath: /shared

  volumes:
    - name: shared-logs
      emptyDir: {}