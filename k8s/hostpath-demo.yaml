apiVersion: apps/v1
kind: Deployment
metadata:
  name: hostpath-writer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hostpath-writer
  template:
    metadata:
      labels:
        app: hostpath-writer
        demo: hostpath
    spec:
      containers:
        - name: writer
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              while true; do
                echo "$(date) Movie Watchlist hostPath event" >> /shared/watchlist.log
                sleep 5
              done
          volumeMounts:
            - name: shared-data
              mountPath: /shared
      volumes:
        - name: shared-data
          hostPath:
            path: /data/movie-watchlist/shared-demo
            type: DirectoryOrCreate

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hostpath-reader
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hostpath-reader
  template:
    metadata:
      labels:
        app: hostpath-reader
        demo: hostpath
    spec:
      containers:
        - name: reader
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              while true; do
                if [ -f /shared/watchlist.log ]; then
                  echo "Reading hostPath logs:"
                  tail -n 3 /shared/watchlist.log
                else
                  echo "Waiting for shared file..."
                fi
                sleep 8
              done
          volumeMounts:
            - name: shared-data
              mountPath: /shared
      volumes:
        - name: shared-data
          hostPath:
            path: /data/movie-watchlist/shared-demo
            type: DirectoryOrCreate